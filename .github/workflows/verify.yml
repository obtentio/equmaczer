name: Verify macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version
      - name: Test
        run: swift test
      - name: Check concurrent publication with Thread Sanitizer
        run: swift test --sanitize=thread --filter PublicationRecoveryTests
      - name: Check driver mapping lifetime in isolation
        run: |
          clang -std=c11 -O1 -g -fsanitize=thread driver/tests/SharedMemoryLifetimeTests.c -o /tmp/driver-lifetime
          /tmp/driver-lifetime
          clang -std=c11 -O1 -g -fsanitize=address driver/tests/SharedMemoryLifetimeTests.c -o /tmp/driver-lifetime-asan
          /tmp/driver-lifetime-asan
      - name: Build driver and release app
        run: |
          brew install librsvg
          ./driver/driver.sh bundle --quiet
          swift build -c release
          EQ_SKIP_BUILD=1 ./bundle.sh app
          codesign --verify --deep --strict release/equmaczer.app
      - name: Measure full DSP stress path
        run: release/equmaczer.app/Contents/MacOS/equmaczer --stress-benchmark
